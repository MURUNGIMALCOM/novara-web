<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | NOVARA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar reveal">

        <img src="logo.jpg" alt="NOVARA Logo" class="logo-img">
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>

    </header>

    <!-- CONTACT -->
    <section class="page">

        <h2 class="reveal">Contact NOVARA</h2>

        <div class="contact-container">

            <!-- LEFT INFO -->
            <div class="contact-info reveal">

                <h3>Let’s Build Something Great</h3>

                <p>Email: info@novara.tech</p>
                <p>Phone: +256 XXX XXX XXX</p>
                <p>Location: Kampala, Uganda</p>

            </div>

            <!-- FORM -->
            <form class="contact-form reveal">

                <div class="input-group">
                    <label>Name</label>
                    <input type="text" placeholder="Your full name">
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="Your email address">
                </div>

                <div class="input-group">
                    <label>Subject</label>
                    <input type="text" placeholder="Subject">
                </div>

                <div class="input-group">
                    <label>Message</label>
                    <textarea rows="6" placeholder="Write your message..."></textarea>
                </div>

                <button class="btn-blue glow-btn" type="submit">
                    Send Message
                </button>

            </form>

        </div>

    </section>
    <script src="script.js"></script>
</body>

</html>
